<div class="top-right">RANGOTSAV.<br>2026<span class="rule"></span></div>
<section class="intro" aria-live="polite"><div class="intro-line"></div><h1 id="category">VISO<br>Culture</h1><p id="tags">Events<br>Lifestyle<br>Moments</p></section>

<div id="galleryStatus" role="status" style="position:fixed;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);color:#aaa;font-size:11px;letter-spacing:.18em;text-align:center;max-width:80vw;pointer-events:none">CONNECTING TO GOOGLE DRIVE…</div><a class="contact-button" id="contactButton" href="https://viso-cloud.github.io/about/" aria-label="Contact">CONTACT</a><button class="hand-toggle" id="handToggle" type="button" aria-label="Move navigation controls to the left" title="Move controls to left side">⇄</button><main class="gallery-stage" id="scrollTrack" aria-label="Stacked photo gallery"><div class="card-stack" id="cardStack"></div><button class="swap-nav swap-prev" id="prevPhoto" type="button" aria-label="Previous photo">↑</button><button class="swap-nav swap-next" id="nextPhoto" type="button" aria-label="Next photo">↓</button></main>
<div class="hint">Scroll to explore ↓</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close-viewer" id="closeViewer">CLOSE ✕</button><img id="viewerImage" alt=""><a class="download" id="downloadImage" download="photo.jpg">↓ DOWNLOAD</a><span class="viewer-count" id="viewerCount">01 / 06</span></div>
<script>
/*
  GOOGLE DRIVE SETUP
  1) Create an API key in Google Cloud Console and enable Google Drive API.
  2) Paste the key below and set FOLDER_ID to the Drive folder ID.
  3) The folder and its images must be shared as "Anyone with the link – Viewer".
  4) Restrict the API key to the Google Drive API and (if hosting) your website's HTTP referrers.
*/
const DRIVE_API_KEY = "AIzaSyDn0HXY-1UDFugbuWLv446zq5HXJrliJZo";
const FOLDER_ID = "1bo7nc8QG4xyVY0dd3wxVLjTub_CTCz0Z";


// Set the title you want displayed on the front page (not the Drive filenames).
const GALLERY_TITLE = "VISO CULTURE";


let photos = [];
const stack=document.getElementById('cardStack'),cards=[];
let active=0,soundOn=true,audioCtx=null,lastTick=0, audioUnlockBound=false;
let cardClassesInitialized=false;
const $=id=>document.getElementById(id);
const CACHE_KEY = `drive-gallery-cache-v2:${FOLDER_ID}`;
const REQUEST_TIMEOUT_MS = 15000;
const RETRY_DELAY_MS = 3000;
let inFlight = false;
let retryTimer = null;
let loadedFromCache = false;

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function driveImageUrl(id, size) {
  // The stack only needs screen-sized thumbnails. Full-size images are loaded in the viewer.
  const thumbWidth = size || (window.matchMedia('(max-width: 700px)').matches ? 700 : 1100);
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${thumbWidth}`;
}
function driveOriginalUrl(id) {
  return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`;
}
function driveDownloadUrl(id) {
  return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;
}
function normalizeFiles(files) {
  return (files || [])
    .filter(file => file && file.id && file.mimeType && file.mimeType.startsWith('image/'))
    .sort((a,b) => (a.name || '').localeCompare(b.name || '', undefined, {numeric:true, sensitivity:'base'}))
    .map(file => ({
      id: file.id,
      name: file.name || 'Photography',
      src: driveImageUrl(file.id),
      original: driveOriginalUrl(file.id),
      download: driveDownloadUrl(file.id),
      title: GALLERY_TITLE,
      tags: 'Photography|Stories|Moments',
      alt: file.name || 'Photo from Google Drive'
    }));
}
function saveCache(files) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      files: files.map(f => ({id:f.id, name:f.name, mimeType:f.mimeType}))
    }));
  } catch (e) {
    console.warn('Could not save gallery cache:', e);
  }
}
function readCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return cached && Array.isArray(cached.files) ? cached.files : [];
  } catch (_) {
    return [];
  }
}
function addPhotoCard(photo, index) {
  const b=document.createElement('button');
  b.className='photo-card';
  b.type='button';
  b.setAttribute('aria-label',`Open photo ${index+1}: ${photo.alt}`);
  const img=document.createElement('img');
  img.src=photo.src;
  img.alt=photo.alt;
  img.loading=index<2?'eager':'lazy';
  img.decoding='async';
  img.fetchPriority=index===0?'high':'auto';
  img.draggable=false;
  img.onerror=()=>{ img.onerror=null; img.src=photo.original; };
  b.appendChild(img);
  b.addEventListener('click',()=>openViewer(Number(b.dataset.photoIndex || index)));
  b.dataset.photoIndex = String(index);
  stack.appendChild(b);
  cards.push(b);
}
function renderPhotos(nextPhotos, {replace=false}={}) {
  const oldActiveId = photos[active]?.id;
  if (replace) {
    stack.replaceChildren();
    cards.length = 0;
  }
  photos = nextPhotos;
  // Rebuild if the list changed in a way that means existing card indices no longer match.
  if (replace) {
    photos.forEach((p,i)=>addPhotoCard(p,i));
  } else {
    for (let i=cards.length; i<photos.length; i++) addPhotoCard(photos[i],i);
    cards.forEach((card,i) => {
      card.dataset.photoIndex = String(i);
      card.setAttribute('aria-label', `Open photo ${i+1}: ${photos[i]?.alt || 'photo'}`);
    });
  }
  if (oldActiveId) {
    const match = photos.findIndex(p=>p.id===oldActiveId);
    active = match >= 0 ? match : Math.min(active, Math.max(0,photos.length-1));
  } else active = Math.min(active, Math.max(0,photos.length-1));
  
  $('scrollTrack').style.height = '100svh';
  if (photos.length) update(active,false);
}
function showStatus(message, visible=true) {
  const status = $('galleryStatus');
  status.textContent = message;
  status.style.display = visible ? 'block' : 'none';
}
async function fetchDrivePage(pageToken='') {
  const params = new URLSearchParams({
    key: DRIVE_API_KEY,
    q: `'${FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`,
    pageSize: '25',
    orderBy: 'name',
    fields: 'nextPageToken,files(id,name,mimeType)'
  });
  if (pageToken) params.set('pageToken', pageToken);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    const response = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`, {
      signal: controller.signal,
      cache: 'no-store'
    });
    if (!response.ok) {
      let detail = '';
      try { detail = (await response.json()).error?.message || ''; } catch (_) {}
      throw new Error(detail || `Google Drive API returned ${response.status}`);
    }
    return await response.json();
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Google Drive request timed out after 15 seconds');
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}
async function refreshDrivePhotos() {
  if (inFlight) return;
  if (!DRIVE_API_KEY || DRIVE_API_KEY.startsWith('PASTE_') ||
      !FOLDER_ID || FOLDER_ID.startsWith('PASTE_')) {
    if (!photos.length) showStatus('ADD YOUR GOOGLE DRIVE API KEY + FOLDER ID IN THE SCRIPT');
    return;
  }
  inFlight = true;
  if (retryTimer) {
    clearTimeout(retryTimer);
    retryTimer = null;
  }
  if (!photos.length) showStatus('CONNECTING TO GOOGLE DRIVE…');
  let pageToken = '';
  let freshFiles = [];
  try {
    do {
      const data = await fetchDrivePage(pageToken);
      const pageFiles = (data.files || []).filter(f => f.mimeType?.startsWith('image/'));
      freshFiles = freshFiles.concat(pageFiles);

      // Render each page as it arrives, rather than waiting for every page.
      const normalized = normalizeFiles(freshFiles);
      renderPhotos(normalized, {replace:true});
      saveCache(freshFiles);
      showStatus('', false);
      pageToken = data.nextPageToken || '';
    } while (pageToken);

    if (!photos.length) {
      showStatus('NO PHOTOS FOUND — CHECK THE FOLDER ID AND SHARING PERMISSIONS');

    } else {
      showStatus('', false);
    }
  } catch (error) {
    console.error('Google Drive gallery refresh error:', error);
    if (photos.length) {
      showStatus(`SHOWING SAVED PHOTOS — RETRYING IN 3 SECONDS. ${error.message}`);
    } else {
      showStatus(`COULD NOT LOAD PHOTOS — RETRYING IN 3 SECONDS. ${error.message}`);
    }
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
      retryTimer = null;
      inFlight = false;
      refreshDrivePhotos();
    }, RETRY_DELAY_MS);
  } finally {
    // Keep inFlight set while a scheduled retry is pending to prevent duplicate requests.
    if (!retryTimer) inFlight = false;
  }
}
function startGallery() {
  const cachedFiles = readCache();
  if (cachedFiles.length) {
    loadedFromCache = true;
    renderPhotos(normalizeFiles(cachedFiles), {replace:true});
    showStatus('SHOWING SAVED PHOTOS — CHECKING FOR UPDATES…', true);
    // Briefly show the status, but keep the cached gallery visible and interactive.
    setTimeout(() => { if (photos.length) showStatus('', false); }, 1800);
  } else {
    showStatus('CONNECTING TO GOOGLE DRIVE…');
  }
  refreshDrivePhotos();
}

function update(i,playSound=false){
 if(!photos.length||!cards.length)return;
 i=Math.max(0,Math.min(photos.length-1,i));
 if(i===active && cards[i]?.classList.contains('active'))return;
 const previous=active, changed=i!==active;
 active=i;
 // On first render, initialize every card once so all distant cards are hidden.
 // After that, update only cards near the old/new active positions.
 const affected=new Set();
 if(!cardClassesInitialized){
   for(let n=0;n<cards.length;n++)affected.add(n);
   cardClassesInitialized=true;
 } else {
   for(let n=Math.max(0,previous-2);n<=Math.min(cards.length-1,previous+2);n++)affected.add(n);
   for(let n=Math.max(0,active-2);n<=Math.min(cards.length-1,active+2);n++)affected.add(n);
 }
 affected.forEach(n=>{
   const c=cards[n], d=n-active;
   c.className='photo-card';
   if(d===0)c.classList.add('active');
   else if(d===-1)c.classList.add('above-1');
   else if(d===-2)c.classList.add('above-2');
   else if(d===1)c.classList.add('below-1');
   else if(d===2)c.classList.add('below-2');
   else c.classList.add('hidden-card');
 });
 
 $('category').innerHTML=document.body.classList.contains('left-hand-mode')
   ? esc(GALLERY_TITLE).trim().split(/\s+/).join('<br>')
   : esc(GALLERY_TITLE);
 $('tags').style.display='none';
 
 
 if(changed&&playSound)tick();
}
function tick(){if(!soundOn)return;if(!audioCtx)enableSoundAndVibration();const now=performance.now();if(now-lastTick<100)return;lastTick=now;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(1250,t);o.frequency.exponentialRampToValueAtTime(680,t+.045);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.075);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.08)}catch(e){}if(navigator.vibrate)navigator.vibrate(8)}
function enableSoundAndVibration(){
 soundOn=true;
 try{
   audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
   if(audioCtx.state==='suspended') audioCtx.resume();
 }catch(e){}
}
function unlockAudioOnFirstInteraction(){
 if(audioUnlockBound)return;
 audioUnlockBound=true;
 const unlock=()=>{
   enableSoundAndVibration();
   // Remove unlock listeners once the browser allows audio playback.
   if(audioCtx && audioCtx.state==='running'){
     window.removeEventListener('pointerdown',unlock);
     window.removeEventListener('touchstart',unlock);
     window.removeEventListener('keydown',unlock);
   }
 };
 window.addEventListener('pointerdown',unlock,{passive:true});
 window.addEventListener('touchstart',unlock,{passive:true});
 window.addEventListener('keydown',unlock);
}
// Try to start audio immediately; browsers may block sound until the first user gesture.
enableSoundAndVibration();
unlockAudioOnFirstInteraction();
function jump(i){
 if(!photos.length)return;
 const next=Math.max(0,Math.min(photos.length-1,i));
 update(next,true);
}
$('prevPhoto')?.addEventListener('click',()=>jump(active-1));
$('nextPhoto')?.addEventListener('click',()=>jump(active+1));

// Mouse-wheel / trackpad navigation: move through photos without scrolling the page.
let wheelLock = false;
window.addEventListener('wheel', (event) => {
  if (!photos.length || $('viewer').classList.contains('open')) return;
  event.preventDefault();
  if (wheelLock) return;
  wheelLock = true;
  const direction = event.deltaY > 0 ? 1 : event.deltaY < 0 ? -1 : 0;
  if (direction) jump(active + direction);
  setTimeout(() => { wheelLock = false; }, 420);
}, { passive: false });

const handToggle=$('handToggle');
handToggle?.addEventListener('click',()=>{
 const stage=$('scrollTrack');
 const left=stage.classList.toggle('controls-left');
 document.body.classList.toggle('left-hand-mode', left);
 $('category').innerHTML = left ? esc(GALLERY_TITLE).trim().split(/\s+/).join('<br>') : esc(GALLERY_TITLE);
 handToggle.setAttribute('aria-label',left?'Move navigation controls to the right side':'Move navigation controls to the left side');
 handToggle.title=left?'Move controls to right side':'Move controls to left side';
});
function openViewer(i){
 if(!photos.length)return;
 active=i;update(i,false);
 const photo=photos[i], image=$('viewerImage');
 image.onerror=null;
 image.alt=photo.alt || 'Photography';
 image.dataset.fallbackStep='0';
 // Drive's uc?export=view endpoint can return a confirmation/HTML page instead of image bytes.
 // Use a large thumbnail for reliable inline display; keep the direct download URL on the download link.
 image.onerror=()=>{
   const step=Number(image.dataset.fallbackStep||'0');
   if(step===0){image.dataset.fallbackStep='1';image.src=driveImageUrl(photo.id,1200);}
   else if(step===1){image.dataset.fallbackStep='2';image.src=photo.src;}
   else {image.onerror=null;image.alt='Unable to load this photo. Check that the Google Drive file is shared as Anyone with the link — Viewer.';}
 };
 image.src=driveImageUrl(photo.id,2400);
 $('downloadImage').href=photo.download || driveDownloadUrl(photo.id);
 $('downloadImage').setAttribute('download',photo.name || 'photo.jpg');
 $('viewerCount').textContent=`${String(i+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;
 $('viewer').classList.add('open');
}
function closeViewer(){$('viewer').classList.remove('open')}
$('closeViewer').addEventListener('click',closeViewer);$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))closeViewer()});
startGallery();
</script>
</body></html>
